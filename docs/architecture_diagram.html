<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #060912;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
}
</style>
</head>
<body>
<svg width="900" viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CodeFix System Architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- glow filter for active nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- subtle grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7c3aed" stroke-width="0.15" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#060912"/>
  <rect width="900" height="720" fill="url(#grid)"/>

  <!-- Gradient blobs -->
  <circle cx="150" cy="150" r="180" fill="#7c3aed" opacity="0.04"/>
  <circle cx="750" cy="580" r="200" fill="#3b82f6" opacity="0.04"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TOP BAND: Title -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="3" opacity="0.5">SYSTEM ARCHITECTURE</text>
  <text x="450" y="62" text-anchor="middle" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">🧠 CodeFix</text>

  <!-- top bar accent -->
  <rect x="0" y="0" width="900" height="3" fill="url(#topbar)"/>
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="purplegrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="greengrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bluegrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ambergrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 1: USER -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="50" y="108" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="2" opacity="0.8">01 · USER</text>

  <!-- User node -->
  <g filter="url(#glow)">
    <rect x="370" y="88" width="160" height="52" rx="10" fill="url(#purplegrad)" stroke="#7c3aed" stroke-width="1"/>
    <text x="450" y="111" text-anchor="middle" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">Student</text>
    <text x="450" y="128" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="9">1st / 2nd yr · Python · C · C++</text>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 2: STREAMLIT FRONTEND -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="166" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" marker-end="url(#arr)"/>

  <text x="50" y="190" fill="#3b82f6" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="2" opacity="0.8">02 · STREAMLIT FRONTEND</text>

  <!-- Frontend container -->
  <rect x="60" y="200" width="780" height="130" rx="12" fill="url(#bluegrad)" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="6 3"/>

  <!-- Tab: Home -->
  <rect x="90" y="220" width="160" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <rect x="90" y="220" width="160" height="24" rx="8" fill="#1e3a5f" stroke="none"/>
  <rect x="90" y="232" width="160" height="12" rx="0" fill="#1e3a5f" stroke="none"/>
  <text x="170" y="236" text-anchor="middle" fill="#60a5fa" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700">Home Tab</text>
  <text x="170" y="258" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Hero · Features</text>
  <text x="170" y="272" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Stats · Tagline</text>
  <text x="170" y="286" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Language badges</text>
  <text x="170" y="300" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Feature cards</text>

  <!-- Tab: Solve -->
  <rect x="370" y="220" width="160" height="90" rx="8" fill="#0f172a" stroke="#4c1d95" stroke-width="1.2"/>
  <rect x="370" y="220" width="160" height="24" rx="8" fill="#4c1d95" stroke="none"/>
  <rect x="370" y="232" width="160" height="12" rx="0" fill="#4c1d95" stroke="none"/>
  <text x="450" y="236" text-anchor="middle" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700">Solve Tab ★</text>
  <text x="450" y="258" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8">Config panel</text>
  <text x="450" y="272" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8">Code editor</text>
  <text x="450" y="286" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8">Response cards</text>
  <text x="450" y="300" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8">Always visible</text>

  <!-- Tab: History -->
  <rect x="650" y="220" width="160" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <rect x="650" y="220" width="160" height="24" rx="8" fill="#1e293b" stroke="none"/>
  <rect x="650" y="232" width="160" height="12" rx="0" fill="#1e293b" stroke="none"/>
  <text x="730" y="236" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700">History Tab</text>
  <text x="730" y="258" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Session log</text>
  <text x="730" y="272" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Code + Concept</text>
  <text x="730" y="286" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Filter · Expand</text>
  <text x="730" y="300" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Full AI response</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 3: SOLVE ENGINE — two parallel paths -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- arrows from Solve Tab down to two paths -->
  <line x1="420" y1="330" x2="250" y2="390" stroke="#7c3aed" stroke-width="1" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="480" y1="330" x2="660" y2="390" stroke="#7c3aed" stroke-width="1" opacity="0.7" marker-end="url(#arr)"/>

  <text x="50" y="380" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="2" opacity="0.8">03 · EXECUTION ENGINE</text>

  <!-- Path A: Code Doubt -->
  <rect x="60" y="390" width="340" height="130" rx="12" fill="url(#greengrad)" stroke="#065f46" stroke-width="0.8" stroke-dasharray="6 3"/>
  <text x="230" y="408" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="1">CODE DOUBT PATH</text>

  <!-- subprocess box -->
  <rect x="80" y="415" width="140" height="90" rx="8" fill="#0f172a" stroke="#065f46" stroke-width="0.8"/>
  <text x="150" y="433" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700">subprocess.run()</text>
  <text x="150" y="449" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Write → tmp file</text>
  <text x="150" y="462" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Execute → capture</text>
  <text x="150" y="475" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">stdout + stderr</text>
  <text x="150" y="488" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">timeout = 10s</text>
  <text x="150" y="501" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Delete tmp file</text>

  <!-- arrow between subprocess and prompt builder -->
  <line x1="220" y1="460" x2="254" y2="460" stroke="#34d399" stroke-width="1" opacity="0.6" marker-end="url(#arr)"/>

  <!-- CRISP prompt box -->
  <rect x="255" y="415" width="130" height="90" rx="8" fill="#0f172a" stroke="#065f46" stroke-width="0.8"/>
  <text x="320" y="433" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700">CRISP Prompt</text>
  <text x="320" y="449" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Context</text>
  <text x="320" y="462" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Role</text>
  <text x="320" y="475" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Instructions</text>
  <text x="320" y="488" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Specifics</text>
  <text x="320" y="501" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Parameters</text>

  <!-- Path B: Concept Doubt -->
  <rect x="500" y="390" width="340" height="130" rx="12" fill="url(#ambergrad)" stroke="#78350f" stroke-width="0.8" stroke-dasharray="6 3"/>
  <text x="670" y="408" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="1">CONCEPT DOUBT PATH</text>

  <rect x="520" y="415" width="300" height="90" rx="8" fill="#0f172a" stroke="#78350f" stroke-width="0.8"/>
  <text x="670" y="433" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700">CRISP Concept Prompt</text>
  <text x="670" y="449" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Concept Explanation · Example Code</text>
  <text x="670" y="462" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">Real-World Analogy · Remember This</text>
  <text x="670" y="478" text-anchor="middle" fill="#78350f" font-family="'JetBrains Mono',monospace" font-size="8">Beginner → plain language + analogies</text>
  <text x="670" y="492" text-anchor="middle" fill="#78350f" font-family="'JetBrains Mono',monospace" font-size="8">Intermediate → technical depth + edge cases</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 4: GROQ API -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- arrows down to Groq -->
  <line x1="320" y1="522" x2="390" y2="570" stroke="#3b82f6" stroke-width="1" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="670" y1="522" x2="520" y2="570" stroke="#3b82f6" stroke-width="1" opacity="0.7" marker-end="url(#arr)"/>

  <text x="50" y="558" fill="#60a5fa" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="2" opacity="0.8">04 · GROQ AI API</text>

  <rect x="270" y="568" width="360" height="80" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="270" y="568" width="360" height="30" rx="12" fill="#1e3a8a" stroke="none"/>
  <rect x="270" y="586" width="360" height="12" rx="0" fill="#1e3a8a" stroke="none"/>
  <text x="450" y="588" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">Groq API · llama-3.3-70b-versatile</text>
  <text x="360" y="614" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">retries: 3x</text>
  <text x="450" y="614" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">429 → wait + retry</text>
  <text x="556" y="614" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8">timeout: 60s</text>
  <text x="450" y="630" text-anchor="middle" fill="#1d4ed8" font-family="'JetBrains Mono',monospace" font-size="8">api.groq.com/openai/v1/chat/completions</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 5: RESPONSE CARDS -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- arrow from Groq up-right to response parser -->
  <line x1="450" y1="648" x2="450" y2="668" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" marker-end="url(#arr)"/>

  <text x="50" y="660" fill="#a78bfa" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="2" opacity="0.8">05 · RESPONSE BREAKDOWN</text>

  <!-- 5 response cards -->
  <!-- card 1 -->
  <rect x="60"  y="668" width="130" height="36" rx="6" fill="#0f172a" stroke="#f87171" stroke-width="0.8"/>
  <rect x="60"  y="668" width="4"   height="36" rx="2" fill="#f87171" stroke="none"/>
  <text x="136" y="682" text-anchor="middle" fill="#f87171" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">Error Diagnosis</text>
  <text x="136" y="695" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="7">line number + bug</text>

  <!-- card 2 -->
  <rect x="205" y="668" width="130" height="36" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8"/>
  <rect x="205" y="668" width="4"   height="36" rx="2" fill="#fbbf24" stroke="none"/>
  <text x="281" y="682" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">Why It Happened</text>
  <text x="281" y="695" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="7">root cause explained</text>

  <!-- card 3 -->
  <rect x="350" y="668" width="130" height="36" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="0.8"/>
  <rect x="350" y="668" width="4"   height="36" rx="2" fill="#34d399" stroke="none"/>
  <text x="426" y="682" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">Fixed Code</text>
  <text x="426" y="695" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="7">complete corrected</text>

  <!-- card 4 -->
  <rect x="495" y="668" width="130" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8"/>
  <rect x="495" y="668" width="4"   height="36" rx="2" fill="#3b82f6" stroke="none"/>
  <text x="571" y="682" text-anchor="middle" fill="#3b82f6" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">Code Improvement</text>
  <text x="571" y="695" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="7">better habit tip</text>

  <!-- card 5 -->
  <rect x="640" y="668" width="130" height="36" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="0.8"/>
  <rect x="640" y="668" width="4"   height="36" rx="2" fill="#a78bfa" stroke="none"/>
  <text x="716" y="682" text-anchor="middle" fill="#a78bfa" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">Remember This</text>
  <text x="716" y="695" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="7">1-line memorizable rule</text>

  <!-- session state loop arrow -->
  <path d="M830 686 Q870 686 870 440 Q870 330 810 330 L790 330" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.5" marker-end="url(#arr)"/>
  <text x="878" y="520" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono',monospace" font-size="8" transform="rotate(-90 878 520)">session_state · history</text>

</svg>
</body>
</html>
